[workspace]
resolver = "3"
members = ["crates/cli", "crates/tools/password-generator"]

[workspace.package]
edition = "2024"
repository = "https://github.com/SkandarS0/HandyTools"
license = "MIT"

[workspace.dependencies]
thiserror = "2.0.20"

[workspace.metadata.release]
sign-commit = true
sign-tag = true
consolidate-commits = false
pre-release-commit-message = "chore(release): Release version {{version}}"
tag-message = "chore(release): Release version {{version}}"
owners = ["SkandarS0"]

[profile.release]
strip = true
lto = true
codegen-units = 1
