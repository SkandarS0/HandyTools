[workspace]
resolver = "3"
members = ["crates/cli", "crates/tools/password-generator"]

[workspace.package]
edition = "2024"
version = "0.1.2"
repository = "https://github.com/SkandarS0/HandyTools"
license = "MIT"

[workspace.dependencies]
thiserror = "2.0.20"

[workspace.metadata.release]
sign-commit = true
sign-tag = true

[profile.release]
strip = true
lto = true
codegen-units = 1
